name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Train model for tests
        run: python model/train.py

      - name: Lint with flake8
        run: |
          cd app
          flake8 . --max-line-length=120

      - name: Run tests
        env:
          MODEL_PATH: ../model/model.pkl
        run: |
          cd app
          pytest -v tests/

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/ml-app:latest" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build -t "$IMAGE" -f docker/Dockerfile .

      - name: Push Docker image
        run: docker push "$IMAGE"

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to VM2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM2_HOST }}
          username: ${{ secrets.VM2_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/ml-prediction-service
            git pull origin main
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" > docker/.env
            chmod 600 docker/.env
            echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker-compose -f docker/docker-compose.yml pull
            docker-compose -f docker/docker-compose.yml down
            docker-compose -f docker/docker-compose.yml up -d
